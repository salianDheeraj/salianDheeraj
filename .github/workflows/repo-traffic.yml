name: Update repository traffic dashboard

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-traffic-dashboard
  cancel-in-progress: false

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect traffic and render SVG
        env:
          GH_OWNERS: salianDheeraj,GitOnBoard
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_TOKEN_ORG: ${{ secrets.TRAFFIC_TOKEN_ORG }}
        run: python scripts/collect_traffic.py
      - name: Commit updated data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repo-traffic.json assets/repo-traffic.svg README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update repository traffic dashboard"
            git push
          fi
